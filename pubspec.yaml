name: tether_app
description: A safety check-in app with biometric authentication and AI-powered gesture recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - using older stable versions to fix channel-error issue
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5

  # Authentication
  local_auth: ^2.1.8
  google_sign_in: ^6.2.1
  # flutter_facebook_auth: ^7.1.1  # Temporarily disabled
  sign_in_with_apple: ^6.1.3  # iOS only

  # Location services
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # Camera and ML
  camera: ^0.10.5+9
  # Temporarily disabled due to Firebase/ML Kit nanopb version conflict
  # google_mlkit_face_detection: ^0.11.1
  # google_mlkit_pose_detection: ^0.12.1
  # google_mlkit_commons: ^0.8.1
  # TODO: Switch to native Vision API (iOS) and ML Kit (Android) via platform channels
  # Note: If Xcode 15+ issues occur, we'll implement platform channels with native Vision API

  # Voice (for premium feature) - temporarily disabled for Android compatibility
  # speech_to_text: ^6.6.0  # TODO: Re-enable for Phase 4 with updated version
  permission_handler: ^11.2.0

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI/UX
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Utilities
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # generate: true  # Using manual localization in lib/l10n/

  assets:
    - assets/images/
    - assets/icons/

  # fonts:  # Temporarily disabled until font files are added
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
